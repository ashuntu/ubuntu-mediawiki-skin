services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mediawiki
      MYSQL_USER: mediawiki
      MYSQL_PASSWORD: mediawiki
    volumes:
      - db-data:/var/lib/mysql

  mediawiki:
    image: mediawiki:1.46
    environment:
      # Passed to LocalSettings.php so $wgServer matches the published port.
      UBUNTU_SKIN_PORT: ${UBUNTU_SKIN_PORT:-8081}
    ports:
      # Default port 8081, not 8080: the ubuntu-mediawiki-extension dev stack
      # uses 8080/8088. Override with UBUNTU_SKIN_PORT=<port>.
      - "${UBUNTU_SKIN_PORT:-8081}:80"
    volumes:
      # Skin files are served directly from this directory (live mount)
      - .:/var/www/html/skins/Ubuntu
      # composer.local.json pulls in the UbuntuWiki extension from GitHub;
      # `make setup` / `make up` run composer inside the container to install it
      - ./composer.local.json:/var/www/html/composer.local.json
      # LocalSettings.php is managed via: make deploy
    depends_on:
      - db

volumes:
  db-data: {}
